<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Raleway:wght@400..600&family=Manrope:wght@400..600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>component-003</title>
  </head>
  <body>
    <div id="mfa-app">
      <section class="mfa-services">
        <figure class="mfa-services__media">
          <div class="mfa-services__media-layer">
            <img
              src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=80"
              alt="Team planning strategy on a whiteboard with sticky notes"
            />
          </div>
        </figure>

        <div class="mfa-services__content">
          <nav class="mfa-services__list" aria-label="Our services">
            <span class="mfa-services__eyebrow">( Our Services )</span>
            <a
              class="mfa-services__item mfa-is-active"
              href="#strategy"
              data-index="0"
              aria-current="true"
            >
              Strategy
            </a>
            <a class="mfa-services__item" href="#brand-identity" data-index="1">
              Brand Identity
            </a>
            <a class="mfa-services__item" href="#design" data-index="2">
              Design
            </a>
            <a class="mfa-services__item" href="#film" data-index="3"> Film </a>
            <a class="mfa-services__item" href="#digital" data-index="4">
              Digital
            </a>
            <span class="mfa-services__indicator" aria-hidden="true"></span>
          </nav>

          <div class="mfa-services__footer">
            <div class="mfa-services__desc-wrap">
              <p class="mfa-services__desc">
                We work closely with our clients to uncover what truly defines
                their brand. Through shared exploration, we find the idea that
                guides how it speaks and acts.
              </p>
            </div>
            <a
              class="mfa-services__cta"
              href="#strategy"
              aria-label="View Strategy service"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 17 17 7M9 7h8v8" />
              </svg>
            </a>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
